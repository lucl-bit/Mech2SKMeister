name: Tests und Deploy zu GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Erst pruefen, dann veroeffentlichen: die JS-Loeser muessen die Ergebnisse
  # der Python-Loeser treffen (tests_static/golden.json), sonst kein Deploy.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt

      - name: Python-Tests
        run: python -m unittest discover -s schnittkraft_trainer/tests -t .

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Golden-Vergleich JS gegen Python
        run: node --test tests_static/solver.test.js

      # Golden-Werte mit Toleranz pruefen, nicht bit-exakt: numpy nutzt je
      # Plattform ein anderes BLAS, np.linalg.solve weicht in der letzten
      # Stelle ab (macOS Accelerate gegen OpenBLAS auf dem Runner).
      - name: Golden-Werte passen zu den Python-Loesern
        run: python tools/check_golden.py

      # Die vorgenerierten Daten sind dagegen streng deterministisch und
      # muessen bit-genau zum eingecheckten Stand passen.
      - name: Vorgenerierte Daten sind aktuell
        run: |
          python tools/build_static.py --seeds 40
          if ! git diff --quiet -- web/data; then
            echo "::error::web/data weicht ab. Bitte 'python3 tools/build_static.py' laufen lassen und web/data committen."
            git diff --stat -- web/data
            exit 1
          fi

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
